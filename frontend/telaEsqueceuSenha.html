<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Preserva+ | Recuperação de senha</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-esqueceu-senha">

  <div class="card card-senha">
    <div class="logo-center">
      <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="24" fill="rgba(21,128,61,0.12)"/>
        <path d="M24 10 C24 10 14 18 14 26 C14 31.5 18.5 36 24 36 C29.5 36 34 31.5 34 26 C34 18 24 10 24 10Z" fill="#4ade80"/>
        <path d="M20 28 C20 28 22 22 28 20" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="30" cy="16" r="4" fill="#60a5fa" opacity="0.8"/>
      </svg>
      <span class="logo-text dark">Preserva<span>+</span></span>
    </div>

    <h1 class="senha-title">Recuperação de senha</h1>
    <p class="senha-desc">Insira o endereço de e-mail ou número de telefone associado à sua conta do Preserva+.</p>

    <div class="field">
      <label>E-mail ou número de telefone</label>
      <input type="text" id="recuperacao" />
    </div>

    <button class="btn-primary" id="btn-continuar">Continuar</button>
    <p class="error-msg" id="erro-senha"></p>

    <p class="senha-info">
      Você receberá um e-mail ou SMS com instruções para redefinir sua senha. Verifique também a sua caixa de spam, caso não veja o e-mail em alguns minutos.
    </p>

    <a href="login.html" class="senha-voltar">Retornar à página de login</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
