<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Preserva+ | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-login">

  <div class="left-panel">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="24" fill="rgba(255,255,255,0.15)"/>
        <path d="M24 10 C24 10 14 18 14 26 C14 31.5 18.5 36 24 36 C29.5 36 34 31.5 34 26 C34 18 24 10 24 10Z" fill="#4ade80"/>
        <path d="M20 28 C20 28 22 22 28 20" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="30" cy="16" r="4" fill="#60a5fa" opacity="0.8"/>
      </svg>
      <span class="logo-text">Preserva<span>+</span></span>
    </div>
    <div class="left-content">
      <p class="tagline">Transforme o descarte<br>em futuro...</p>
      <p class="tagline-desc">Com foco na conscientização, educação ambiental e engajamento de todos para contribuir para um futuro mais verde e sustentável.</p>
    </div>
  </div>

  <div class="right-panel">
    <div class="form-box">
      <p class="welcome-tag">Bem-vindo de volta</p>
      <h1>Faça o seu Login</h1>

     <form id="formLogin">
        <div class="field">
          <label for="loginEmail">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required />
          </div>
        </div>

        <div class="field">
          <label for="loginSenha">Senha</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginSenha" placeholder="Digite sua senha" required />
          </div>
        </div>

        <div class="row-check">
          <label class="check-label">
            <input type="checkbox" id="lembrarMe" /> Lembrar-me
          </label>
          <a href="telaEsqueceuSenha.html" class="forgot">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-primary" id="btnEntrar">Entrar</button>
      </form>

      <div class="divider">Ou</div>

      <button type="button" class="social-btn">
        <svg class="social-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Login com o Google
      </button>

      <p class="register-link">Não possui uma conta? <a href="telaCadastro.html">Registre-se agora</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="auth.js"></script>
</body>
</html>
