<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Preserva+ | Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-cadastro">

  <div class="wrapper">
    <a href="login.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </a>

    <div class="card">
      <div class="card-header">
        <h1>Crie sua conta</h1>
        <p>Já possui uma conta? <a href="login.html">Login</a></p>
      </div>

      <form id="formCadastro">
        <div class="form-grid">
          <div class="field">
            <label for="cadNome">Nome da instituição</label>
            <input type="text" id="cadNome" placeholder="Ex: Recicla +" required />
          </div>

          <div class="field">
            <label for="cadCnpj">CNPJ</label>
            <input type="text" id="cadCnpj" placeholder="00.000.000/0001-00" required />
          </div>

          <div class="field">
            <label for="cadEndereco">Endereço</label>
            <input type="text" id="cadEndereco" placeholder="Rua, Bairro, Cidade" required />
          </div>

          <div class="field">
            <label for="cadTelefone">Telefone</label>
            <input type="tel" id="cadTelefone" placeholder="(62) 90000-0000" required />
          </div>

          <div class="field full">
            <label for="cadEmail">Email</label>
            <input type="email" id="cadEmail" placeholder="contato@empresa.com.br" required />
          </div>

          <div class="field">
            <label for="cadSenha">Senha</label>
            <input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres" required />
          </div>

          <div class="field">
            <label for="cadConfirmaSenha">Confirmar senha</label>
            <input type="password" id="cadConfirmaSenha" placeholder="Confirme a senha" required />
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btnCadastrar">Criar conta</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="auth.js"></script>
</body>
</html>
